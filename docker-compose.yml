# free-llm-router —— AMD VPS 1 生产部署（Docker）
#
# ⚠️ 这份文件是**线上实际运行的唯一权威定义**，与 `/home/ubuntu/free-llm-router/run.sh` 一致。
#    曾经它和 run.sh 互相矛盾（这里写 `11451:11451` 对公网，run.sh 写 `127.0.0.1:11452`），
#    误用其中一份就会把面板直接暴露到公网 —— 那种「两份配置各说各话」正是要消除的。
#
# ## 端口为什么是 127.0.0.1:11452 而不是 0.0.0.0:11451
#
# 前面有 Caddy 做 TLS 反代（`router.enking.org`），容器**只允许本机访问**。
# 对外暴露端口等于绕开 Caddy 的 TLS 与鉴权边界。
#
# ## 为什么挂载 dist/server.mjs 而不是在镜像里构建
#
# `npm run build:node` 在**宿主机**产出单文件，镜像只负责运行。
# 这样更新只需替换一个文件 + 重启，不必在服务器上装 node_modules 或重新 build 镜像。
# 代价：改了源码后**必须**在本地重建并上传，否则容器跑的还是旧产物（线上曾因此落后 12 天）。

services:
  free-llm-router:
    image: free-llm-router:latest
    container_name: free-llm-router
    restart: unless-stopped
    # ⚠️ 只绑本机回环：外部访问一律走 Caddy
    ports:
      - "127.0.0.1:11452:11451"
    # ⚠️ 所有密钥（API_KEY / CREDENTIAL_KEY）都在这个文件里，**不要**写进本文件的 environment
    env_file:
      - .env
    volumes:
      # 账号凭据 + 用量都在 data/ 里，**务必持久化**
      # ⚠️ router.db 里的 system_kv 存着 credential_key —— 丢了这个文件等于所有账号要重新登录
      - ./data:/app/data
      - ./dist/server.mjs:/app/dist/server.mjs
    # ⚠️ 不限制日志大小会无限增长（线上曾出现「日志把有用信息埋没」）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
